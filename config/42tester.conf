	listen 127.0.0.1:9999;

	client_max_body_size 100;

	location / {
		methods GET; # / must answer to GET request ONLY
		root www;
		index index.html;
		autoindex off;
	}

	location /post_body {
		methods POST;
		root www;
		client_max_body_size 100;
	}

