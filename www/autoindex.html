<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 0 16px;
      color: #1f2937;
      background: #ffffff;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .path {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.98em;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }

    li {
      border-bottom: 1px solid #e5e7eb;
    }

    li:last-child {
      border-bottom: none;
    }

    a {
      display: block;
      padding: 12px 14px;
      text-decoration: none;
      color: #0070f3;
      font-weight: 500;
      transition: background-color 0.15s ease;
    }

    .home {
      margin-top: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>Index of {{PATH}}</h1>
  <p class="path">Directory listing, displayed when the 'autoindex' option is 'on'</p>
  <ul>
{{LIST_ITEMS}}  </ul>
  <a class="home" href="/">Back to Home</a>
</body>
</html>
